[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-mlops"
version = "0.1.0"
description = "A production-minded MLOps reference implementation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "mlflow",
    "dvc",
    "hydra-core",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pandera",
    "ruff",
    "evidently",
]

[tool.setuptools]
packages = ["iris_mlops", "monitoring", "flows"]

[tool.setuptools.package-dir]
iris_mlops = "src/iris_mlops"
monitoring = "monitoring"
flows = "flows"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
